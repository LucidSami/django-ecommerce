[build]
builder = "nixpacks"

[build.nixpacksPlan.variables]
PYTHON_VERSION = "3.12"

[deploy]
startCommand = "gunicorn ecomproject.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.preDeploy]
command = "python manage.py migrate --noinput"
